services:
  - type: web
    name: propertyflow-platform
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_DEVELOPER_NAME
        sync: false
      - key: BOOTSTRAP_DEVELOPER_EMAIL
        sync: false
      - key: BOOTSTRAP_DEVELOPER_PASSWORD
        sync: false
      - key: AFRICASTALKING_ENVIRONMENT
        value: production
      - key: DARAJA_ENVIRONMENT
        value: sandbox
      - key: DARAJA_SHORTCODE
        value: "174379"
      - key: DARAJA_CALLBACK_TOKEN
        generateValue: true
      - key: DARAJA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
